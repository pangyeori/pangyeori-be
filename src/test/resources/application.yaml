spring:
  application:
    name: pangyeori

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false
    open-in-view: false

  flyway:
    enabled: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: test@gmail.com
    password: test
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

aws:
  region: ap-northeast-2
  s3:
    bucket: test-bucket
    presign:
      upload-expiry: 5m
      download-expiry: 10m

security:
  jwt:
    issuer: pangyeori
    secret: test-secret-key-must-be-at-least-32-bytes-long
    access-token-expiration: 15m
    refresh-token-expiration: 14d

cors:
  allowed-origins: http://example.com
