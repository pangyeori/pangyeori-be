spring:
  application:
    name: pangyeori

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false
    open-in-view: false

  flyway:
    enabled: false

aws:
  region: ap-northeast-2
  ses:
    from-address: no-reply@pangyeori.com

security:
  jwt:
    issuer: pangyeori
    secret: test-secret-key-must-be-at-least-32-bytes-long
    access-token-expiration: 15m
    refresh-token-expiration: 14d

cors:
  allowed-origins: http://example.com
