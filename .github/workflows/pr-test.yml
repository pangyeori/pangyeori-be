name: PR Test

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run tests (incl. API docs)
        run: ./gradlew generateDocs --no-daemon

  notify:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Compute short SHA
        id: vars
        run: echo "sha=${SHA:0:7}" >> "$GITHUB_OUTPUT"
        env:
          SHA: ${{ github.event.pull_request.head.sha }}

      - name: Notify Slack
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [
                {
                  "color": "${{ needs.test.result == 'success' && '#2eb886' || '#e01e5a' }}",
                  "text": "${{ needs.test.result == 'success' && ':white_check_mark: PR 테스트 성공' || ':x: PR 테스트 실패' }}\n*PR*: <${{ github.event.pull_request.html_url }}|#${{ github.event.pull_request.number }}>\n*브랜치*: `${{ github.head_ref }}`\n*커밋*: <${{ github.event.pull_request.html_url }}/changes/${{ github.event.pull_request.head.sha }}|${{ steps.vars.outputs.sha }}> by ${{ github.actor }}\n*실행 로그*: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                }
              ]
            }
