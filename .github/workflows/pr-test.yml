name: PR Test

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run tests (incl. API docs)
        run: ./gradlew generateDocs --no-daemon

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ job.status == 'success' && ':white_check_mark: PR 테스트 성공' || ':x: PR 테스트 실패' }}\n*PR*: <${{ github.event.pull_request.html_url }}|#${{ github.event.pull_request.number }}>\n*브랜치*: `${{ github.head_ref }}`\n*커밋*: `${{ github.event.pull_request.head.sha }}` by ${{ github.actor }}\n*실행 로그*: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
